name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & build web assets
        run: |
          npm install
          npm run build --if-present

      - name: Determine Web Assets Directory & Configure Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Detect where the built web files actually live
          if [ -f "dist/index.html" ]; then
            WEB_DIR="dist"
          elif [ -f "build/index.html" ]; then
            WEB_DIR="build"
          elif [ -f "public/index.html" ]; then
            WEB_DIR="public"
          elif [ -f "index.html" ]; then
            # If the web app is at root, create a dedicated bundle folder
            mkdir -p app_dist
            cp -r index.html css js assets app_dist/ 2>/dev/null || cp -r * app_dist/ 2>/dev/null || true
            WEB_DIR="app_dist"
          else
            # Fallback placeholder to prevent build crash
            mkdir -p dist
            echo "<!DOCTYPE html><html><head><title>App</title></head><body>App initialized</body></html>" > dist/index.html
            WEB_DIR="dist"
          fi

          echo "Using web directory: $WEB_DIR"

          # Write capacitor config with correct webDir
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.astrology.ruleengine",
            "appName": "Astrology Rule Engine",
            "webDir": "$WEB_DIR"
          }
          EOF

          # Add and sync android platform
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrology Chart Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; }
        input {
            width: 100%;
            padding: 0.6rem;
            border-radius: 4px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 4px;
            background-color: #0284c7;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover { background-color: #0369a1; }
        #response { margin-top: 1.5rem; font-size: 0.9rem; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <h2>Enter Birth Details</h2>
    <form id="astroForm">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="John Doe">
        </div>
        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" required>
        </div>
        <div class="form-group">
            <label for="tob">Time of Birth</label>
            <input type="time" id="tob" required>
        </div>
        <div class="form-group">
            <label for="lat">Latitude</label>
            <input type="number" step="any" id="lat" required placeholder="e.g. 17.3850">
        </div>
        <div class="form-group">
            <label for="lon">Longitude</label>
            <input type="number" step="any" id="lon" required placeholder="e.g. 78.4867">
        </div>
        <button type="submit">Generate Horoscope</button>
    </form>
    <div id="response"></div>
</div>

<script>
    document.getElementById('astroForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const payload = {
            name: document.getElementById('name').value,
            date_of_birth: document.getElementById('dob').value,
            time_of_birth: document.getElementById('tob').value,
            latitude: parseFloat(document.getElementById('lat').value),
            longitude: parseFloat(document.getElementById('lon').value)
        };

        const responseDiv = document.getElementById('response');
        responseDiv.innerText = "Calculating planetary positions...";

        try {
            // Replace with your backend API URL
            const response = await fetch('YOUR_BACKEND_API_URL/calculate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            responseDiv.innerText = JSON.stringify(data, null, 2);
        } catch (error) {
            responseDiv.innerText = "Error connecting to backend server.";
            console.error('Error:', error);
        }
    });
</script>

</body>
</html>
